version: v0.4
project:
  name: A smaller upper bound for superpermutations
  description: For the shortest superpermutation length S(n), construct covering words with asymptotic
    bound S(n) <= n! + (n-1)! + (n-2)! + (926683/1814400 + o(1))(n-3)!. The development proves an explicit
    finite bound for every n >= 14 and its numerical consequences. The coefficient is approximately 0.510738.
    The argument combines a finite selection, a verified connector cover, and transport to larger alphabets.
  authors:
  - Jay Pantone
  license: Apache-2.0
  responsible_maintainers:
  - Jay Pantone
