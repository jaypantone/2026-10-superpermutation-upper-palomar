name = "superpermutation_upper_palomar"
version = "0.1.0"
defaultTargets = ["AlmanacSolution", "AlmanacAxioms"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "AxiomCheck"

[[lean_lib]]
name = "UpperConstruction"
roots = []
globs = ["upper.+", "SuperpermutationUpperBound.+", "UpperBoundProof.+"]

[[lean_lib]]
name = "AlmanacDefs"

[[lean_lib]]
name = "AlmanacStatement"

[[lean_lib]]
name = "AlmanacChallenge"

[[lean_lib]]
name = "AlmanacSolution"

[[lean_lib]]
name = "AlmanacAdapter"

[[lean_lib]]
name = "AlmanacAxioms"
